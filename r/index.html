<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Processing your payment…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0f;color:#e4e4ed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .box{text-align:center;padding:2rem;max-width:420px}
  .spin{width:44px;height:44px;margin:0 auto 1.5rem;border:4px solid #2a2a3a;border-top-color:#7c5cfc;border-radius:50%;animation:rot 0.9s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  h1{font-size:1.25rem;font-weight:700;margin:0 0 .5rem}
  p{color:#a0a0b8;font-size:.95rem;line-height:1.6;margin:.5rem 0}
  a.btn{display:inline-block;margin-top:1.25rem;padding:.7rem 1.6rem;background:#7c5cfc;color:#fff;border-radius:10px;text-decoration:none;font-weight:600}
  code{background:#1a1a24;padding:.15rem .4rem;border-radius:5px;font-size:.85rem}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <h1 id="title">Payment received</h1>
  <p id="msg">Taking you to your API key…</p>
  <p id="err" style="display:none">If you are not redirected automatically, click below to open the app you purchased:</p>
  <a id="gobtn" class="btn" style="display:none">Go to your app →</a>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var product = q.get("product");
  var txn = q.get("_ptxn") || "";
  var map = {
    csvsanitizer: "https://csvsanitizer.vercel.app/success",
    htmlshield:  "https://htmlshield.vercel.app/success"
  };
  var base = map[product];
  var title = document.getElementById("title");
  var msg = document.getElementById("msg");
  if (base) {
    var dest = base + (txn ? "?checkout_id=" + encodeURIComponent(txn) : "");
    msg.textContent = "Taking you to your API key…";
    document.getElementById("gobtn").href = dest;
    document.getElementById("gobtn").style.display = "inline-block";
    document.getElementById("gobtn").textContent = "Continue to " + product + " →";
    document.getElementById("err").style.display = "block";
    setTimeout(function(){ location.replace(dest); }, 1200);
  } else {
    title.textContent = "Payment received";
    msg.innerHTML = "Thank you for your purchase. You'll receive your API key by email shortly, and it's also available on your receipt.";
    document.getElementById("err").style.display = "none";
    document.querySelector(".spin").style.display = "none";
  }
})();
</script>
</body>
</html>
